name: iOS build check

# Runs on every push/PR so we get "does it compile" feedback without needing
# a local Mac. Builds for the iOS Simulator only, with code signing turned
# off, so it needs no Apple Developer account and no certificates/secrets.
# It does NOT produce an installable app (that needs a signed device or
# TestFlight build, which is a separate, later step).
#
# Xcode version note: this project's pbxproj was last touched by Xcode 26
# (LastUpgradeCheck = 2600, objectVersion = 77) — Xcode 16.x can't fully
# resolve simulator destinations for a project file this new, even though
# the simulator runtimes themselves are installed. Must select an Xcode 26.x
# app on the runner, not 16.x.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios-grounded
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Show Xcode version (debugging aid)
        run: xcodebuild -version

      - name: Build for Simulator (no code signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Grounded.xcodeproj \
            -scheme Grounded \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty || xcodebuild build \
            -project Grounded.xcodeproj \
            -scheme Grounded \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

  screenshot:
    # Separate job: actually launches the app on a virtual iPhone screen and
    # saves what it looks like, so Aaron can see real progress without a Mac
    # or an Apple Developer account. Not interactive — just a snapshot of
    # whatever screen the app opens to (currently onboarding, since a fresh
    # simulator install has no saved state). Runs only if the compile check
    # above passes, so we don't waste runner time screenshotting broken code.
    needs: build
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios-grounded
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Find an available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; data=json.load(sys.stdin); \
              devices=[d for runtime in data['devices'].values() for d in runtime if 'iPhone' in d['name']]; \
              print(devices[0]['udid'] if devices else '')")
          if [ -z "$UDID" ]; then
            echo "No iPhone simulator found" >&2
            exit 1
          fi
          echo "Using simulator: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Boot the simulator
        run: xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true

      - name: Build for that specific simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Grounded.xcodeproj \
            -scheme Grounded \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty || xcodebuild build \
            -project Grounded.xcodeproj \
            -scheme Grounded \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Install and launch the app
        run: |
          APP_PATH=$(find build -name "Grounded.app" -path "*iphonesimulator*" | head -1)
          echo "App path: $APP_PATH"
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP_PATH"
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" app.rork.11hs3d669rqjl4wb8wlwy
          sleep 6

      - name: Take a screenshot
        run: xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot screenshot.png

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: grounded-app-screenshot
          path: ios-grounded/screenshot.png

  barcode-scan-test:
    # Runs the barcode scanner's manual-entry path against the REAL Open Food Facts API.
    # This exists because the sandbox this feature was built in has no network access to
    # openfoodfacts.org, so ProductLookupService/ProductGrading were written blind from
    # documented API shape and never exercised against a live response. GitHub's macOS
    # runners have normal internet access, so this is the actual, automated proof that the
    # lookup + grading pipeline works end to end — without needing a physical device,
    # TestFlight, or an Apple Developer account. See BarcodeScanUITests.swift for the test
    # itself and why the manual-entry path (not the camera) is used.
    needs: build
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios-grounded
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Find an available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; data=json.load(sys.stdin); \
              devices=[d for runtime in data['devices'].values() for d in runtime if 'iPhone' in d['name']]; \
              print(devices[0]['udid'] if devices else '')")
          if [ -z "$UDID" ]; then
            echo "No iPhone simulator found" >&2
            exit 1
          fi
          echo "Using simulator: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Boot the simulator
        run: xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true

      - name: Run the barcode scan UI test (real network call)
        # Not wrapped in the usual xcpretty-with-fallback pattern used elsewhere in this
        # file: that pattern re-runs the whole command on failure, which would collide with
        # -resultBundlePath already having been created by the first attempt. Piped through
        # `tee` instead of straight into xcpretty so the real xcodebuild exit code (not
        # xcpretty's) decides pass/fail, and the raw log survives as a fallback artifact if
        # xcpretty ever mis-parses the output.
        run: |
          set -o pipefail
          xcodebuild test \
            -project Grounded.xcodeproj \
            -scheme Grounded \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:GroundedUITests/BarcodeScanUITests/testManualBarcodeLookupAgainstRealAPI \
            -resultBundlePath "$PWD/barcode-scan-test.xcresult" \
            | tee "$PWD/barcode-scan-test-raw.log" | xcpretty
          exit "${PIPESTATUS[0]}"

      - name: Export the result screenshot
        # Runs even if the test above failed — a failed run's screenshot is exactly what's
        # needed to see what actually went wrong (stuck on loading, wrong screen, etc).
        #
        # xcresulttool export's exact flags have shifted across Xcode versions, so this is
        # unverified against a live run as of writing. If the uploaded artifact's
        # barcode-scan-attachments folder comes out empty, check
        # `xcrun xcresulttool export attachments --help` on the runner (Xcode 26.3) for the
        # current syntax — the fallback below at least confirms whether this step is the
        # problem, rather than failing silently.
        if: always()
        run: |
          xcrun xcresulttool export attachments \
            --path "$PWD/barcode-scan-test.xcresult" \
            --output-path "$PWD/barcode-scan-attachments" \
            || echo "xcresulttool export failed or used different syntax — check barcode-scan-test-raw.log and the .xcresult bundle directly instead."
          echo "--- attachments exported ---"
          ls -la "$PWD/barcode-scan-attachments" 2>/dev/null || echo "(no attachments directory was created)"

      - name: Upload barcode scan test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grounded-barcode-scan-test
          path: |
            ios-grounded/barcode-scan-attachments
            ios-grounded/barcode-scan-test.xcresult
            ios-grounded/barcode-scan-test-raw.log

  appetize-upload:
    # Uploads the simulator build to Appetize.io so Aaron can interact with the real app in
    # a browser tab — full navigation, tapping, typing — without a Mac, an Apple Developer
    # account, or TestFlight. The barcode scanner's actual camera won't work through a
    # browser-simulated device; everything else (chat, Apothecary, onboarding, account,
    # manual barcode entry) will.
    #
    # Builds its own copy of Grounded.app rather than reusing the build/screenshot jobs' —
    # GitHub Actions jobs run on separate runners with separate filesystems, so nothing
    # carries over between jobs without an explicit upload-artifact/download-artifact pair.
    # Matches the same rebuild-per-job pattern the screenshot and barcode-scan-test jobs
    # above already use.
    #
    # Requires a repo secret named APPETIZE_API_TOKEN (Settings → Secrets and variables →
    # Actions) — an Appetize API token with the "Developer" role.
    #
    # First run: no APPETIZE_APP_PUBLIC_KEY secret exists yet, so this CREATES a new app on
    # Appetize and prints its link (and the publicKey to save) in the job summary — click
    # into the finished "appetize-upload" job on the Actions run page to see it. Add that
    # publicKey as a new repo secret named APPETIZE_APP_PUBLIC_KEY, and every run after that
    # will UPDATE the same app in place instead of creating a new one — so the link stays
    # the same forever rather than changing on every push.
    needs: build
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios-grounded
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Build for Simulator (no code signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Grounded.xcodeproj \
            -scheme Grounded \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty || xcodebuild build \
            -project Grounded.xcodeproj \
            -scheme Grounded \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Zip the .app bundle for upload
        # ditto (not plain zip) preserves the app bundle's internal symlinks correctly —
        # Apple's own recommended way to archive a .app for redistribution.
        run: |
          APP_PATH=$(find build -name "Grounded.app" -path "*iphonesimulator*" | head -1)
          echo "App path: $APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" grounded.zip

      - name: Upload to Appetize (create new app, or update the existing one)
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
          APPETIZE_APP_PUBLIC_KEY: ${{ secrets.APPETIZE_APP_PUBLIC_KEY }}
        run: |
          if [ -n "$APPETIZE_APP_PUBLIC_KEY" ]; then
            echo "Updating existing Appetize app $APPETIZE_APP_PUBLIC_KEY"
            REQUEST_URL="https://api.appetize.io/v1/apps/$APPETIZE_APP_PUBLIC_KEY"
          else
            echo "No APPETIZE_APP_PUBLIC_KEY secret found yet — creating a new Appetize app for the first time"
            REQUEST_URL="https://api.appetize.io/v1/apps"
          fi

          curl -sS -X POST "$REQUEST_URL" \
            -H "X-API-KEY: $APPETIZE_API_TOKEN" \
            -F "platform=ios" \
            -F "note=Grounded - commit ${{ github.sha }}" \
            -F "file=@grounded.zip" \
            -o response.json

          cat response.json

          PUBLIC_KEY=$(python3 -c "import json; print(json.load(open('response.json')).get('publicKey', ''))")
          if [ -z "$PUBLIC_KEY" ]; then
            echo "Appetize did not return a publicKey - check the response printed above for an error." >&2
            exit 1
          fi

          {
            echo "## Try Grounded live in your browser"
            echo ""
            echo "https://appetize.io/app/$PUBLIC_KEY"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$APPETIZE_APP_PUBLIC_KEY" ]; then
            {
              echo "**First run — save this as a new repo secret named APPETIZE_APP_PUBLIC_KEY:**"
              echo ""
              echo "\`$PUBLIC_KEY\`"
              echo ""
              echo "Settings -> Secrets and variables -> Actions -> New repository secret."
              echo "Every run after that updates this same app instead of creating a new one, so the link above stays valid forever."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
