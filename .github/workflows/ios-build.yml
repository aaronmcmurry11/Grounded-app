name: iOS build check

# Runs on every push/PR so we get "does it compile" feedback without needing
# a local Mac. Builds for the iOS Simulator only, with code signing turned
# off, so it needs no Apple Developer account and no certificates/secrets.
# It does NOT produce an installable app (that needs a signed device or
# TestFlight build, which is a separate, later step).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios-grounded
    steps:
      - uses: actions/checkout@v4

      - name: Diagnostics — what's actually on this runner
        run: |
          echo "--- Installed Xcode apps ---"
          ls /Applications | grep -i xcode || true
          echo "--- Default xcodebuild -version ---"
          xcodebuild -version
          echo "--- Installed simulator runtimes (default Xcode) ---"
          xcrun simctl list runtimes || true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app || true

      - name: Diagnostics after selecting Xcode 16
        run: |
          echo "--- xcodebuild -version ---"
          xcodebuild -version
          echo "--- Installed simulator runtimes ---"
          xcrun simctl list runtimes || true
          echo "--- Destinations xcodebuild sees for the Grounded scheme ---"
          xcodebuild -showdestinations -project Grounded.xcodeproj -scheme Grounded || true

      - name: Build for Simulator (no code signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Grounded.xcodeproj \
            -scheme Grounded \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty || xcodebuild build \
            -project Grounded.xcodeproj \
            -scheme Grounded \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
